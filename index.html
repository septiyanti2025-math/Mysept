<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Septiyanti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header>
            <h1>Kalkulator</h1>
            <p>By Septiyanti</p>
        </header>

        <div class="display">
            <div id="history"></div>
            <input type="text" id="result"
                   value="0" readonly aria-label="Hasil kalkulasi">
        </div>

        <div class="buttons">
            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="delete">DEL</button>
            <button class="special" data-action="percent">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="special" data-action="sign">±</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-action="calculate">=</button>
        </div>

        <p class="footer">© 2026 Septiyanti</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
